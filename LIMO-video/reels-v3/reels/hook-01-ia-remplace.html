<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>LIMO — L’IA va remplacer les agents immo</title>
    <script src="assets/lib/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/kit.css" />
    <link rel="stylesheet" href="assets/kit/naturel.css" />
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Source Serif 4"; src: url("assets/fonts/source-serif-4-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/caveat-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Montserrat Hook"; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.6" data-width="1080" data-height="1920">
      <section id="s-main" class="clip" data-start="0" data-duration="14.6" data-track-index="0"></section>
      <audio id="sfx" src="assets/audio/hook-01-ia-remplace.wav" data-start="0" data-duration="14.6" data-track-index="10" data-volume="1"></audio>
    </div>
    <script src="assets/kit/kit.js"></script>
    <script src="assets/kit/naturel.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        K.init(tl);
        const root = document.getElementById("s-main");
        const D = 14.6;
        N.init(tl, root, D);
        const chip = N.chip(`${K.icon("alert")}AGENTS IMMO`, { top: "300px" });
        const hk = N.hook(["L’IA VA", "REMPLACER", "<span class='st'>LES AGENTS<i></i></span>", "<span class='st'>IMMO<i></i></span>"], { top: "400px", fontSize: "116px" }, { st: 1.0 });
        const h2 = N.head(["SEULEMENT CEUX", "QUI NE L’UTILISENT PAS<span class='v'>.</span>"], { top: "1000px", fontSize: "70px" }, 1.6);
        K.sfx(1.6, "thump", 0.3);
        N.out([chip, hk, h2], 4.0, { y: -40 });
        const cap = N.cap("L’utiliser, c’est simple :", { top: "150px" }, 4.3);
        const ph = N.phoneLimo({ left: "213px", top: "560px" }, 4.4);
        const n1 = N.notif({ title: "ANNONCE", text: "Maison à Allassac : annonce rédigée, mentions légales incluses." }, { left: "90px", top: "640px" }, 5.2);
        const n2 = N.notif({ title: "RELANCE", text: "M. Vidal : SMS de relance prêt, tu n’as qu’à valider.", g: 0.2 }, { left: "90px", top: "860px" }, 6.1);
        const n3 = N.notif({ title: "ESTIMATION", text: "Appartement Brive centre : avis de valeur prêt à envoyer.", snd: "success", g: 0.28 }, { left: "90px", top: "1080px" }, 7.0);
        N.out([cap, ph, n1, n2, n3], 8.9, { y: -30 });
        const c2 = N.cap("L’IA ne te remplace pas.<br>Elle bosse pour toi.", { top: "760px" }, 9.2, { dark: true });
        N.out(c2, 10.8, { y: -20 });
        window.__TE = 11.0;
        N.outro(11.0, "comment");
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
