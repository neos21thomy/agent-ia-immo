    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        K.init(tl);
        const root = document.getElementById("s-main");
        const D = 30.0;
        N.init(tl, root, D);
        A.init(tl, root);
        C.init(tl, root, D);
        const glow = (x, y, s, t) => { const g = N.ab("n-glow", null, { left: x + "px", top: y + "px", width: s + "px", height: s + "px" }); g.setAttribute("data-layout-allow-overflow", ""); N.hide(g); tl.fromTo(g, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, t); return g; };
        const gains = (t, G, note) => {
          const h = N.head(["CE QUE ÇA", "TE RAPPORTE<span class='v'>.</span>"], { top: "170px", fontSize: "86px" }, t);
          const els = G.map((g, i) => {
            const c = N.ab("g-card", `<div class="k">${g.k}</div><div class="v ${g.c || ""}"><span>${g.v0 || ""}</span></div><div class="d">${g.d}</div>`, { left: "90px", top: 480 + i * 330 + "px", width: "900px" });
            N.hide(c);
            const tt = t + 0.5 + i * 0.7;
            tl.fromTo(c, { opacity: 0, x: i % 2 ? 120 : -120 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, tt);
            K.sfx(tt, "whoosh", 0.12, 0, { d: 0.35, f0: 600, f1: 3000, pk: 0.6 });
            if (g.n != null) K.count(K.$(".v span", c), g.n, tt + 0.2, 1.0, g.f, { ticks: 10 }); else K.$(".v span", c).innerHTML = g.v;
            if (g.n != null) K.sfx(tt + 1.2, "success", 0.18);
            return c;
          });
          const nt = N.text("ctr g-note", note || "Exemples indicatifs", { top: "1490px" }, t + 2.4);
          return [h, ...els, nt];
        };
        const fin = (t, M) => {
          N.outro(t, "contact");
          const m = N.mascot({ left: "440px", top: "1240px", width: "200px" });
          m.enter(t + 1.6);
          m.wave(t + 2.3);
          m.blink(t + 3.2);

        tl.set([K.$(".n-bg", root), ...K.$$(".n-arc", root)], { opacity: 0 }, 0);
        const sh = C.ab({ left: "0", top: "0", width: "1080px", height: "1920px", background: "linear-gradient(180deg, rgba(5,6,15,.55) 0%, rgba(5,6,15,0) 30%, rgba(5,6,15,0) 55%, rgba(5,6,15,.65) 100%)" });

        const t1 = C.title("3 [biens]. 1 seul [bras] [droit].", { top: "410px", fontSize: "84px" }, 0.25, { color: "#ffffff", accent: "#d9ceff" });
        [t0, t1].forEach((e) => e.classList.add("shade"));
        C.out([t0, t1], 2.6);
        C.bars(2.4, true, 1.0);
        const S = [
          [2.9, "Villa · forêt", "pen", "Annonce rédigée", "en 2 minutes"],

        ];
        [5.0, 10.0].forEach((t) => { C.flash(t - 0.05, "#ffffff", 0.7); K.sfx(t - 0.1, "whoosh", 0.2, 0, { d: 0.35, f0: 600, f1: 4000, pk: 0.6 }); });
        S.forEach((x, i) => {
          const [t, lieu, ic, big, small] = x;
          const loc = C.ab({ left: "0", right: "0", top: "1240px", textAlign: "center" }, `<span class="gchip">${K.icon("pin")}${lieu}</span>`);
          tl.set(loc, { opacity: 0 }, 0);
          K.pop(loc, t, { s: 0.7 });
          const c = C.ab({ left: "140px", width: "800px", top: "1330px", padding: "28px 34px", display: "flex", alignItems: "center", gap: "24px" }, `<span style="flex:none;width:84px;height:84px;border-radius:24px;background:rgba(44,196,181,.4);display:flex;align-items:center;justify-content:center">${K.icon(ic)}</span><span><b style="display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:44px">${big}</b><span style="font-size:28px;color:rgba(255,255,255,.8)">${small}</span></span><span style="margin-left:auto;width:58px;height:58px;border-radius:50%;background:#2cc4b5;display:flex;align-items:center;justify-content:center">${K.icon("check")}</span>`);
          c.classList.add("glass");
          K.$$("svg.i", c).forEach((g) => (g.style.cssText = "width:44px;height:44px;color:#fff"));
          tl.set(c, { opacity: 0 }, 0);
          tl.fromTo(c, { opacity: 0, y: 60, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t + 0.5);
          K.sfx(t + 0.5, "success", 0.22);
          const end = i === 2 ? 14.4 : S[i + 1][0] - 0.35;
          tl.to([loc, c], { opacity: 0, duration: 0.3 }, end);
        });
        const t2 = C.title("Toi, tu [vends].", { top: "380px", fontSize: "90px" }, 12.2, { color: "#ffffff", accent: "#d9ceff" });
        t2.classList.add("shade");
        C.out([t2, sh], 14.4, 0.4);
        C.flash(14.7, "#ffffff", 0.95);
        const light = C.bg({ background: "linear-gradient(180deg, #f5f3fe 0%, #ece7fb 100%)" });
        tl.set(light, { clipPath: "circle(0px at 540px 960px)" }, 0);
        C.iris(light, 14.7, 0.8);
        C.leak(14.8, 2.6);
        glow(140, 520, 800, 15.0);
        const ph = A.phone({ left: "260px", top: "540px", width: "560px" }, { time: "9:41" });
        const pg = [
          `<div class="a-back">${K.icon("chev")}Annonce</div><div class="a-ph" style="height:230px;margin-bottom:14px"><img src="assets/img/villa-photo.jpg" alt="" style="width:100%;height:100%;object-fit:cover" /></div><div class="a-card" style="padding:20px 22px"><div style="font-family:'Source Serif 4',serif;font-size:30px;font-weight:600;line-height:1.2">Villa d’architecte entre béton et forêt</div></div><div style="display:flex;gap:10px;margin-top:14px"><span class="a-tag t">${K.icon("check")}Mentions légales</span></div>`,
          `<div class="a-back">${K.icon("chev")}Avis de valeur</div><div class="a-ph" style="height:230px;margin-bottom:14px"><img src="assets/img/chalet-photo.jpg" alt="" style="width:100%;height:100%;object-fit:cover" /></div>` + A.row("calc", "v", "685 000 € – 735 000 €", "Fourchette estimée"),
          `<div class="a-back">${K.icon("chev")}Acquéreurs</div><div class="a-ph" style="height:200px;margin-bottom:14px"><img src="assets/img/cabane-photo.jpg" alt="" style="width:100%;height:100%;object-fit:cover" /></div>` + A.row("users", "v", "Famille Lambert", "Visite samedi 10 h", "", `<span class="a-tag t">96 %</span>`) + A.row("users", "v", "M. et Mme Petit", "Visite samedi 11 h 30", "", `<span class="a-tag t">92 %</span>`),
        ].map((h) => A.page(ph, h));
        A.enter(ph, 15.0, { flatAt: 0.9 });
        C.cam(15.6, { scale: 1.05, rotation: -1 }, 6.0, "sine.inOut");
        const W = [["IL RÉDIGE<span class='v'>.</span>", 15.4], ["IL ESTIME<span class='v'>.</span>", 17.4], ["IL TROUVE<span class='v'>.</span>", 19.4]];
        W.forEach((w, i) => {
          if (i > 0) A.go(ph, pg[i - 1], pg[i], w[1]);
          const big = C.ab({ left: "0", right: "0", top: "330px", textAlign: "center", fontFamily: "'Montserrat Hook', Montserrat, sans-serif", fontWeight: "800", fontSize: "104px", color: "#1b1f4b" }, w[0]);
          K.$$(".v", big).forEach((v) => (v.style.color = "#6b4fe0"));
          tl.set(big, { opacity: 0 }, 0);
          tl.fromTo(big, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, w[1] + 0.05);
          tl.to(big, { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, w[1] + 1.75);
          K.sfx(w[1] + 0.05, "slam", 0.16);
        });
        A.leave(ph, 21.4);
        C.cam(21.4, { scale: 1, rotation: 0 }, 0.6, "power2.inOut");
        const M = N.mascot({ left: "280px", top: "760px", width: "520px" });
        M.enter(21.9);
        M.glow(22.3, 1.2);
        M.wave(22.6);
        const b = N.say("Moi, c’est LIMO, ton bras droit.<br><span class='v'>Teste-moi 14 jours !</span>", { left: "140px", top: "520px", width: "800px" }, 22.8);
        M.expr("wink", 24.0);
        N.out(b, 25.6, { y: -10, d: 0.2 });
        window.__TE = 26.0;
        N.outro(26.0, "pub");
        M.move(25.9, { x: 0, y: 1370 - (760 + 314), scale: 200 / 520 }, 0.7);
        M.expr("happy", 26.0, false);
        M.wave(27.2);
        window.__timelines["main"] = tl;
      })();
