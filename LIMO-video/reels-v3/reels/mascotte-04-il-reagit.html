<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>LIMO — LIMO réagit à tes habitudes</title>
    <script src="assets/lib/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/kit.css" />
    <link rel="stylesheet" href="assets/kit/naturel.css" />
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Source Serif 4"; src: url("assets/fonts/source-serif-4-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/caveat-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Montserrat Hook"; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.4" data-width="1080" data-height="1920">
      <section id="s-main" class="clip" data-start="0" data-duration="15.4" data-track-index="0"></section>
      <audio id="sfx" src="assets/audio/mascotte-04-il-reagit.wav" data-start="0" data-duration="15.4" data-track-index="10" data-volume="1"></audio>
    </div>
    <script src="assets/kit/kit.js"></script>
    <script src="assets/kit/naturel.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        K.init(tl);
        const root = document.getElementById("s-main");
        const D = 15.4;
        N.init(tl, root, D);
        const endM = (M, left, top, W, t) => {
          const H = (W * 904) / 747;
          const s = 260 / W;
          M.move(t, { x: 890 - (left + W / 2), y: 1610 - (top + H / 2), scale: s, rotation: -8 }, 0.7);
          M.expr("happy", t + 0.1, false);
          M.wave(t + 0.9);
          M.blink(t + 2.4);
        };

        const chip = N.chip(`${K.icon("alert")}ÇA PIQUE UN PEU`, { top: "200px" });
        const hk = N.hook(["LIMO RÉAGIT", "À TES", "<span class='hl'>HABITUDES.</span>"], { top: "300px", fontSize: "116px" });
        const M = N.mascot({ left: "280px", top: "920px", width: "520px" });
        M.float(0, 11, 10);
        M.blink(1.4);
        N.out([chip, hk], 2.4, { y: -40 });
        const R = [["Tu rappelles ton vendeur<br>« la semaine prochaine ».", "wow", "shake"], ["Tu recopies le compromis<br>à la main.", "dizzy", "tilt"], ["5 avis Google<br>sans réponse.", "sad", ""], ["Tu bosses encore<br>le dimanche soir.", "angry", "shake"]];
        R.forEach((r, i) => {
          const t = 2.6 + i * 1.8;
          const c = N.cap(r[0], { top: "360px" }, t);
          M.expr(r[1], t + 0.55);
          if (r[2] === "shake") M.shake(t + 0.6, 0.4);
          if (r[2] === "tilt") { M.tilt(t + 0.6, 14); M.tilt(t + 1.5, 0, 0.2); }
          if (r[1] === "sad") K.sfx(t + 0.55, "bloop-down", 0.2);
          N.out(c, t + 1.65, { y: -10, d: 0.15 });
        });
        const b = N.say("Stop. <span class='v'>Laisse-moi faire.</span>", { left: "190px", top: "680px", width: "700px" }, 9.9, { cls: "" });
        M.expr("happy", 9.9, false);
        M.glow(10.0, 1.0);
        M.hop(10.1, 90);
        N.out(b, 11.4, { y: -10, d: 0.2 });
        window.__TE = 11.6;
        N.outro(11.6, "comment");
        endM(M, 280, 920, 520, 11.5);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
