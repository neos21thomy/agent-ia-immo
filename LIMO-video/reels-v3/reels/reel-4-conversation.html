<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>LIMO — Reel 4 · J'ai laissé mon IA gérer ma journée</title>
    <script src="assets/lib/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/kit.css" />
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Source Serif 4";
        src: url("assets/fonts/source-serif-4-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Source Serif 4";
        src: url("assets/fonts/source-serif-4-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      #cap {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 132px;
        height: 132px;
        padding: 18px 26px;
        border-radius: 22px;
        background: #ffffff;
        color: #0e1630;
        font-weight: 700;
        font-size: 38px;
        line-height: 1.26;
        text-align: center;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      #app {
        position: absolute;
        left: 40px;
        top: 300px;
        width: 1000px;
        height: 1340px;
        border-radius: 48px;
        background: var(--app);
        border: 2px solid var(--card-b);
        overflow: hidden;
      }
      #hdr {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 124px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 30px;
        border-bottom: 2px solid #221c36;
        background: var(--app);
        z-index: 2;
      }
      #hdr .av {
        width: 78px;
        height: 78px;
        border-radius: 22px;
        background: linear-gradient(145deg, #8a6bff, #5b3fd6);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #hdr .av svg {
        width: 64px;
        height: 64px;
      }
      #hdr b {
        display: block;
        font-size: 34px;
        color: var(--txt);
      }
      #hdr span {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        font-size: 24px;
        color: var(--muted);
      }
      #hdr span i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #2bd99a;
      }
      #view {
        position: absolute;
        left: 0;
        right: 0;
        top: 124px;
        height: 1086px;
        overflow: hidden;
      }
      #thread {
        position: absolute;
        left: 0;
        top: 0;
        width: 1000px;
        height: 12000px;
      }
      #bar {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 24px;
        height: 96px;
        border-radius: 30px;
        background: var(--card);
        border: 2px solid var(--card-b);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px 0 30px;
        font-size: 28px;
        color: var(--muted);
        z-index: 2;
      }
      #bar .ph {
        flex: 1;
      }
      #bar .mic {
        width: 66px;
        height: 66px;
        border-radius: 20px;
        background: var(--violet-bg);
        color: var(--violet-l);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #bar .mic svg.i {
        width: 30px;
        height: 30px;
      }
      .u {
        position: absolute;
        right: 24px;
        max-width: 820px;
        padding: 22px 28px;
        border-radius: 32px 32px 8px 32px;
        background: var(--blue);
        color: #fff;
        font-size: 32px;
        line-height: 1.35;
        transform-origin: 100% 100%;
      }
      .u.voice,
      .u.file {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .u.voice svg.i {
        width: 34px;
        height: 34px;
      }
      .u .wv {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 40px;
      }
      .u .wv i {
        display: block;
        width: 6px;
        border-radius: 3px;
        background: #fff;
      }
      .u .pdf {
        width: 52px;
        height: 64px;
        border-radius: 9px;
        background: #c62f35;
        color: #fff;
        font-weight: 900;
        font-size: 15px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 8px;
      }
      .u small {
        display: block;
        font-size: 22px;
        opacity: 0.85;
      }
      .lb {
        position: absolute;
        left: 24px;
        width: 608px;
        transform-origin: 0 0;
      }
      .lb > * {
        position: absolute;
        left: 0;
        top: 0;
      }
      .ld {
        position: absolute;
        left: 24px;
      }
      .lt {
        position: absolute;
        left: 24px;
        width: 760px;
        padding: 24px 30px;
        border-radius: 32px 32px 32px 8px;
        background: var(--card);
        border: 2px solid var(--card-b);
        font-family: "Source Serif 4", serif;
        font-size: 36px;
        line-height: 1.4;
        color: var(--txt);
      }
      .lt b {
        color: var(--cyan);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35.3" data-width="1080" data-height="1920">
      <section id="s-main" class="clip" data-start="0" data-duration="35.3" data-track-index="0"></section>
      <audio id="sfx" src="assets/audio/reel-4-conversation.wav" data-start="0" data-duration="35.3" data-track-index="10" data-volume="1"></audio>
    </div>
    <script src="assets/kit/kit.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        K.init(tl);
        const root = document.getElementById("s-main");
        const D = 35.3;
        K.bg(root, { dur: D });

        /* ---------- légende d'accroche ---------- */
        const cap = K.h("div", "", "", root);
        cap.id = "cap";
        tl.fromTo(cap, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 0.05);
        K.sfx(0.05, "pop", 0.2, 0, { f: 600 });
        K.type(cap, "J’ai laissé mon IA gérer ma journée d’agent immo…", 0.2, 1.2, 0.06);

        /* ---------- l'appli ---------- */
        const app = K.h("div", "", `<div id="hdr"><div class="av">${K.ROBOT}</div><div><b>LIMO</b><span><i></i>en ligne · ton bras droit</span></div></div><div id="view"><div id="thread"></div></div><div id="bar"><span class="ph">Parle à LIMO…</span><span class="mic">${K.icon("mic")}</span></div>`, root);
        app.id = "app";
        tl.fromTo(app, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.35);
        K.sfx(0.35, "whoosh", 0.18, 0, { d: 0.5, f0: 200, f1: 1800, pk: 0.6 });
        const thread = K.$("#thread", app);
        const VIEW = 1086 - 28;

        /* ---------- la conversation ---------- */
        const wave = (n) => Array.from({ length: n }, (_, i) => `<i style="height:${10 + Math.round(26 * Math.abs(Math.sin(i * 1.3 + 0.5)))}px"></i>`).join("");
        const X = [
          ["t", "Salut LIMO ! On fait quoi aujourd’hui ?", 1, "brief", {}, 610],
          ["voice", "", 1, "fiche", {}, 340],
          ["file", "", 1, "doc", { fieldsOnly: true }, 410],
          ["t", "Tu m’estimes le 12 rue des Lilas ?", 1, "estim", {}, 470],
          ["t", "Écris-moi l’annonce.", 1, "annonce", {}, 520],
          ["t", "Et les posts pour les réseaux ?", 1, "posts", {}, 470],
          ["t", "Mets « VENDU » sur la photo des Dupont.", 1, "photo", {}, 410],
          ["t", "Marie m’a laissé 5 étoiles !", 1, "avis", {}, 490],
          ["t", "C’est l’anniversaire de Mme Roy.", 1, "sms", {}, 470],
          ["t", "Des vendeurs potentiels dans le coin ?", 1, "detect", {}, 530],
          ["t", "Le DPE de 2020 de mon vendeur est encore bon ?", 2, "droit", { answerOnly: true }, 230],
        ];
        const MAKERS = { brief: K.brief, fiche: K.fiche, doc: K.doc, estim: K.estim, annonce: K.annonce, posts: K.posts, photo: K.photo, avis: K.avis, sms: K.sms, detect: K.detect, droit: K.droit };
        const S = 1.12;
        let y = 30;
        let ty = 0;
        let t = 1.55;
        const scrollTo = (bottom, at) => {
          const target = Math.min(ty, VIEW - bottom);
          if (target !== ty) {
            tl.to(thread, { y: target, duration: 0.45, ease: "power2.out" }, at);
            ty = target;
          }
        };
        const userMsg = (x, at) => {
          let el;
          if (x[0] === "voice") el = K.h("div", "u voice", `${K.icon("mic")}<div class="wv">${wave(22)}</div><small>0:09</small>`, thread);
          else if (x[0] === "file") el = K.h("div", "u file", `<div class="pdf">PDF</div><div>Compromis_Roche.pdf<small>12 pages</small></div>`, thread);
          else el = K.h("div", "u", x[1], thread);
          const h = x[0] === "t" ? 44 + 43 * x[2] : x[0] === "voice" ? 96 : 108;
          el.style.top = y + "px";
          tl.fromTo(el, { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(1.7)" }, at);
          K.sfx(at, "send", 0.26, 0.3);
          y += h;
          scrollTo(y, at);
          y += 26;
        };
        X.forEach((x) => {
          userMsg(x, t);
          const dots = K.h("div", "ld k-dots", "<i></i><i></i><i></i>", thread);
          dots.style.top = y + "px";
          K.dots(dots, t + 0.3, 0.38);
          const box = K.h("div", "lb", null, thread);
          Object.assign(box.style, { top: y + "px", height: x[5] + "px", transform: `scale(${S})` });
          const inner = K.h("div", "", null, box);
          Object.assign(inner.style, { position: "absolute", left: "0", top: "0", width: "608px", height: x[5] + "px" });
          const comp = MAKERS[x[3]](inner, x[4]);
          const at = t + 0.72;
          y += x[5] * S;
          scrollTo(y, at);
          const end = comp.play(at);
          y += 40;
          t = end + 0.2;
        });

        /* ---------- chute ---------- */
        userMsg(["t", "T’es qui en fait ?", 1], t);
        const dots = K.h("div", "ld k-dots", "<i></i><i></i><i></i>", thread);
        dots.style.top = y + "px";
        K.dots(dots, t + 0.3, 0.38);
        const last = K.h("div", "lt", "Ton chef de cabinet IA. Essaie-moi <b>14 jours</b>, c’est offert.", thread);
        last.style.top = y + "px";
        K.fin(last, t + 0.72, { y: 24 });
        K.sfx(t + 0.72, "receive", 0.24);
        y += 170;
        scrollTo(y, t + 0.72);
        const TE = t + 2.1;
        K.fout([app, cap], TE - 0.3, { y: -40, d: 0.32 });
        window.__TE = TE;
        K.endCard(root, TE);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
