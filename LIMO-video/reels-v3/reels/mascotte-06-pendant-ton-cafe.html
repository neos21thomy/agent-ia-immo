<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>LIMO — Pendant ton café</title>
    <script src="assets/lib/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/kit.css" />
    <link rel="stylesheet" href="assets/kit/naturel.css" />
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Source Serif 4"; src: url("assets/fonts/source-serif-4-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/caveat-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Montserrat Hook"; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }
      #chrono { top: 250px; font-family: "Montserrat Hook", Montserrat, sans-serif; font-weight: 800; font-size: 96px; color: var(--vio); }
      #chrono span { position: absolute; left: 0; right: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.6" data-width="1080" data-height="1920">
      <section id="s-main" class="clip" data-start="0" data-duration="14.6" data-track-index="0"></section>
      <audio id="sfx" src="assets/audio/mascotte-06-pendant-ton-cafe.wav" data-start="0" data-duration="14.6" data-track-index="10" data-volume="1"></audio>
    </div>
    <script src="assets/kit/kit.js"></script>
    <script src="assets/kit/naturel.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        K.init(tl);
        const root = document.getElementById("s-main");
        const D = 14.6;
        N.init(tl, root, D);
        const endM = (M, left, top, W, t) => {
          const H = (W * 904) / 747;
          const s = 260 / W;
          M.move(t, { x: 890 - (left + W / 2), y: 1610 - (top + H / 2), scale: s, rotation: -8 }, 0.7);
          M.expr("happy", t + 0.1, false);
          M.wave(t + 0.9);
          M.blink(t + 2.4);
        };

        const hk = N.hook(["PENDANT", "TON CAFÉ<span class='v'>,</span>", "<span class='hl'>J’AI FAIT ÇA.</span>"], { top: "260px", fontSize: "100px" });
        const M = N.mascot({ left: "300px", top: "980px", width: "480px" }, { expr: "wink" });
        M.float(0, 10, 10);
        M.blink(1.6);
        N.out(hk, 2.4, { y: -40 });
        const ch = N.ab("ctr", Array.from({ length: 6 }, (_, k) => `<span>${k}:00</span>`).join(""), {});
        ch.id = "chrono";
        N.hide(ch);
        tl.set(ch, { opacity: 1 }, 2.6);
        const cs = K.$$("span", ch);
        cs.forEach((s, k) => { tl.set(s, { opacity: 0 }, 0); tl.set(s, { opacity: 1 }, 2.6 + k * 0.95); if (k < 5) tl.set(s, { opacity: 0 }, 2.6 + (k + 1) * 0.95); });
        const L = ["Brief du jour prêt", "Annonce Brive rédigée", "3 relances préparées", "Avis Google : réponse prête", "Avis de valeur Vignols", "Post LinkedIn publié"];
        const card = N.ab("n-card", L.map((l) => `<div class="n-row"><span style="color:#1c1c1e">${l}</span><i class="ok" style="margin-left:auto">${K.icon("check")}</i></div>`).join(""), { left: "110px", top: "400px", width: "860px" });
        N.hide(card);
        K.fin(card, 2.6, { y: 30, d: 0.4 });
        M.expr("open", 2.6, false);
        M.move(2.6, { y: 120, scale: 0.8 }, 0.5);
        M.glow(3.0, 4.6);
        K.$$(".n-row", card).forEach((r, i) => {
          const t = 3.1 + i * 0.8;
          tl.set(r, { opacity: 0.25 }, 0);
          tl.to(r, { opacity: 1, duration: 0.2 }, t);
          tl.fromTo(K.$(".ok", r), { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.4)" }, t);
          K.sfx(t, "success", 0.12);
          if (i % 2) M.blink(t + 0.2);
        });
        N.out([card, ch], 8.3, { y: -30 });
        M.move(8.3, { y: 0, scale: 1 }, 0.5);
        const b = N.say("Il te reste<br>du café ?", { left: "240px", top: "700px", width: "600px" }, 8.7);
        M.expr("wink", 8.7, false);
        M.hop(8.8, 80);
        N.out(b, 10.6, { y: -10, d: 0.2 });
        window.__TE = 10.8;
        N.outro(10.8, "demo");
        endM(M, 300, 980, 480, 10.7);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
