<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>LIMO — Entretien d’embauche</title>
    <script src="assets/lib/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/kit.css" />
    <link rel="stylesheet" href="assets/kit/naturel.css" />
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Source Serif 4"; src: url("assets/fonts/source-serif-4-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/caveat-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Montserrat Hook"; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }
      .stamp { font-family: "Montserrat Hook", Montserrat, sans-serif; font-weight: 800; font-size: 110px; color: #15877d; border: 12px solid #15877d; border-radius: 26px; padding: 6px 40px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.2" data-width="1080" data-height="1920">
      <section id="s-main" class="clip" data-start="0" data-duration="16.2" data-track-index="0"></section>
      <audio id="sfx" src="assets/audio/mascotte-02-entretien-embauche.wav" data-start="0" data-duration="16.2" data-track-index="10" data-volume="1"></audio>
    </div>
    <script src="assets/kit/kit.js"></script>
    <script src="assets/kit/naturel.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        K.init(tl);
        const root = document.getElementById("s-main");
        const D = 16.2;
        N.init(tl, root, D);
        const endM = (M, left, top, W, t) => {
          const H = (W * 904) / 747;
          const s = 260 / W;
          M.move(t, { x: 890 - (left + W / 2), y: 1610 - (top + H / 2), scale: s, rotation: -8 }, 0.7);
          M.expr("happy", t + 0.1, false);
          M.wave(t + 0.9);
          M.blink(t + 2.4);
        };

        const chip = N.chip(`${K.icon("users")}ENTRETIEN D’EMBAUCHE`, { top: "200px" });
        const hk = N.hook(["POSTE :", "<span class='hl'>ASSISTANT</span>", "D’AGENT IMMO<span class='v'>.</span>"], { top: "300px", fontSize: "100px" });
        const M = N.mascot({ left: "330px", top: "1060px", width: "420px" }, { expr: "open" });
        M.float(0, 12, 10);
        M.expr("think", 1.3, false);
        N.out([chip, hk], 2.6, { y: -40 });
        const QA = [["Vos horaires ?", "24 h / 24. 7 j / 7.", "happy"], ["Et vos congés ?", "Des congés… c’est quoi ?", "wow"], ["Votre salaire ?", "Dès 49 € par mois.", "euro"], ["Vous commencez quand ?", "Tout de suite.<br>14 jours offerts.", "heart"]];
        QA.forEach((q, i) => {
          const t = 2.8 + i * 1.9;
          const Q = N.say(q[0], { left: "90px", top: "320px", width: "620px" }, t, { tail: "down", tx: "90px", n: 0, g: 0 });
          K.sfx(t, "pop", 0.14);
          M.expr("think", t, false);
          const A = N.say(q[1], { left: "300px", top: "760px", width: "690px" }, t + 0.7, { cls: "vio", tail: "down", tx: "240px" });
          M.expr(q[2], t + 0.7, false);
          M.hop(t + 0.75, 40);
          N.out([Q, A], t + 1.75, { y: -10, d: 0.15 });
        });
        const st = N.ab("ctr", `<span class="stamp">EMBAUCHÉ</span>`, { top: "480px" });
        N.hide(st);
        tl.fromTo(st, { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.3, ease: "power4.in" }, 10.5);
        K.sfx(10.78, "stamp", 0.4);
        M.expr("happy", 10.8);
        M.hop(10.9, 110);
        N.out(st, 12.2, { y: -20 });
        window.__TE = 12.4;
        N.outro(12.4, "essai");
        endM(M, 330, 1060, 420, 12.3);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
